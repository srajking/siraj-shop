; php-api/php.ini — the API's own error settings (development)
; run from php-api/:  php -S localhost:8000 -t public -c php.ini
display_errors = Off        ; never show errors to the customer
log_errors = On             ; write them down instead
error_log = ${PWD}/logs/php-error.log   ; ${PWD} = the folder you ran php -S from
error_reporting = E_ALL     ; every kind of error
date.timezone = Asia/Baghdad  ; the shop's clock — without it PHP uses UTC
