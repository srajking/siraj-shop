name: Shop checks

on:
  push:
    branches: [main, react, typescript, state]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Node and packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium

      - name: Accessibility tests
        run: npm test

      - name: List the files
        run: ls

      - name: No debug logs
        run: |
          if grep -n "console.log" app.js; then
            echo "::error::Remove console.log before merging"
            exit 1
          fi

      - name: Nothing after </html>
        run: |
          if grep -n "</html>." *.html; then
            echo "::error::Move this content inside <body>"
            exit 1
          fi

  web:                                            # the React shop in web/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Types                               # vite build does not check them — tsc does
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: State coverage                      # every state file: which lines no test ran
        run: npm run test:state
      - name: Build
        run: npm run build
